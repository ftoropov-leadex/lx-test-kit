name: publish

# Release-triggered, not push-triggered.
#
# GitHub Packages rejects a version that already exists, so a `push: main` trigger would fail on
# every merge that does not bump `gradle.properties`. Tagging is the release action instead.
# The docs site is unaffected: it deploys separately through the Cloudflare Workers Builds Git
# integration (app `cloudflare-workers-and-pages`, config `docs/wrangler.jsonc`) on every push.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # NOT the wrapper. `gradle/wrapper/gradle-wrapper.jar` is deliberately not committed — this is
      # a public repository for a corporate framework, and the owner keeps the bootstrap jar out of
      # it (see known-issues.md §2). The action installs the distribution named in
      # gradle/wrapper/gradle-wrapper.properties, so the Gradle version still matches the wrapper
      # pin; only the commit of the 48 KB bootstrap jar is avoided.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.4.0'

      # `build` before `publish`: the test gate must pass before artifacts leave the building.
      - name: Build and publish to GitHub Packages
        run: gradle clean build publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
